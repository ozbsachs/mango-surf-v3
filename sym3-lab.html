<!doctype html>
<html lang="en" class="s3lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mango Surf symbol lab</title>
<!-- SYM3 review page (sym3-build.js fills in the styles and scripts). Every symbol with Idle, Land and Win on its own
     (polish bar section 4 line 11). URL: ?state=idle|land|win sets every symbol at once, ?board=1 shows a full 20-symbol
     board idling (the frame-rate check), ?key=W shows one symbol big. -->
<style>
@font-face{font-family:"Lilita One";src:url("fonts/LilitaOne-latin.woff2") format("woff2");font-display:swap}
:root{--outline:#2a0e12;--bg:#0f2f3a;--card:#16424f;--ink:#eaf7f5;--dim:#9cc6c2;--gold:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.35 system-ui,sans-serif}
body{padding:12px 16px 40px}
h1{font-size:18px;margin:0 0 4px}
p.note{margin:0 0 10px;color:var(--dim);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
button{font:inherit;font-size:13px;border:2px solid var(--outline);background:#ffe9a8;color:#2a0e12;border-radius:8px;padding:5px 10px;cursor:pointer}
button.on{background:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card h2{font-size:14px;margin:0;align-self:flex-start}
.card h2 small{font-weight:500;color:var(--dim)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:#2f6;color:#032}
.tag.fb{background:#fb5;color:#320}
.cell{width:190px;height:190px;position:relative;padding:14px}
.c{position:relative;width:100%;height:100%}
.ms{position:relative;width:100%;height:100%;display:block}
.ms img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.mx{position:absolute;font:400 clamp(11px,2.2vw,19px)/1 "Lilita One",system-ui,sans-serif;left:50%;transform:translateX(-50%);white-space:nowrap;color:#ffd23f;
  background:linear-gradient(#7a4a22,#4a2a12 60%,#3a1f0c);border:2px solid #ffd23f;border-radius:8px;box-shadow:0 0 0 2px var(--outline);padding:2px 7px 3px}
.ms > .mx{bottom:-8%}
.btns{display:flex;gap:6px}
.reel{position:relative;width:150px;height:440px}
.stackov{position:absolute;inset:0}
.stackov .mstack{position:absolute;inset:0}
.mstack .mx.big{left:50%;transform:translateX(-50%);font-size:20px;padding:4px 12px 6px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:900px}
.board .c{aspect-ratio:1;height:auto}
#fps{font:600 13px monospace;color:var(--gold)}
.big .cell{width:min(420px,90vw);height:min(420px,90vw)}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,1fr);gap:8px}.cell{width:100%;height:auto;aspect-ratio:1;padding:8px}.card{padding:6px}.reel{width:110px;height:330px}}
body.show{padding:0;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#1d6f78,#0f3f4a 60%,#0a2a33);}
body.show::after{content:"";position:fixed;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#e9c98a,#d7ae66);border-top:4px solid #2a0e12}
.stage{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.cap{position:absolute;top:22px;left:0;right:0;text-align:center;font:400 34px/1.1 "Lilita One",system-ui,sans-serif;color:#ffd23f;text-shadow:0 3px 0 #2a0e12}
.cap span{display:block;font-size:24px;color:#eaf7f5;margin-top:4px}
.big-cell{width:430px;height:430px;padding:0;margin-top:56px}
.big-reel{width:200px;height:560px;margin-top:70px}
/* ---------- Mango Surf symbol life (anim-v2/symbols) ----------
   Every symbol has its own small idle loop and its own win loop. Only transform and opacity move, plus the win flash's
   win glow (a baked halo, smooth.css, opacity only). Nothing here changes the cell's (.c) or the symbol box's (.ms) layout or transform: all of
   it lives in .fx, an absolutely placed layer inside .ms (the game measures cells[0] to size the spin strips).
   Markup (sym-fx.js MangoSymFX.inner):
     .ms > .fx > .fx-bk (flash glow, rays, shadow: still)  +  .fx-sq (idle move) > .fx-pop (win beat) > .fx-mv (win part
     motion) > imgs, water, shine, particles
   States: idle by default; win = .ms.win or the win walk's spotlight (.grid.focusing .c.focus .ms); no motion at all in a
   spin strip, on a dimmed symbol, under .fx-still, or with reduced motion. */
.fx{position:absolute;inset:0;container-type:size;pointer-events:none}
.fx-sq,.fx-bk{position:absolute;left:50%;top:50%;width:min(100cqw,100cqh);height:min(100cqw,100cqh);translate:-50% -50%}
.fx-pop,.fx-mv{position:absolute;inset:0}
.fx-mv > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fx i{position:absolute;display:block;font-style:normal}

/* water: the caustic tile drifts inside the letter's / wave's water (masks: one sprite, anim-v2/symbols/build-layers.py).
   One tile = 50% of the symbol; the layer is two tiles wide and moves exactly one tile per loop, so the loop has no seam.
   It is a finishing touch, so its two pictures load after the page (sym-fx.js adds .fx-live): no cost to the first load */
.fx-water{inset:0;display:none;-webkit-mask:url("img/water.webp") var(--wm) 0/600% 100% no-repeat;mask:url("img/water.webp") var(--wm) 0/600% 100% no-repeat;overflow:hidden}
.fx-live .fx-water{display:block}
.fx-water > i{left:0;top:0;width:200%;height:200%;background:url("img/caustic.webp") 0 0/25% 25% repeat;opacity:.5;animation:fxcaus 9s linear infinite}
@keyframes fxcaus{to{transform:translate(-25%,-25%)}}
.ms-L1{--wm:0%}.ms-L2{--wm:20%}.ms-L3{--wm:40%}.ms-L4{--wm:60%}.ms-L5{--wm:80%}.ms-W{--wm:100%}

/* shine (idle): a soft light bar crossing the symbol now and then, cut to its outline (--src, the symbol picture). A win
   uses the game's own shine (.grid .c .ms::after) */
.fx-shine{inset:0;-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;overflow:hidden}
.fx-shine > i{top:-25%;bottom:-25%;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0) 20%,rgba(255,255,255,.62) 50%,rgba(255,255,255,0) 80%,transparent);
  transform:translateX(-130%) rotate(18deg);animation:fxshine 6.5s ease-in-out infinite}
@keyframes fxshine{0%,70%{transform:translateX(-130%) rotate(18deg)}86%,100%{transform:translateX(330%) rotate(18deg)}}
.ms-H4 .fx-shine > i{animation-duration:5.2s}

/* sparkles: a four-point star */
.fx-spk{width:22%;aspect-ratio:1;margin:-11% 0 0 -11%;background:radial-gradient(circle,#fff 0 16%,#fff6c8 28%,rgba(255,226,120,0) 64%);
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0;transform:scale(0)}
@keyframes fxtw{0%,72%,100%{opacity:0;transform:scale(0) rotate(0)}80%{opacity:1;transform:scale(1) rotate(45deg)}90%{opacity:.8;transform:scale(.55) rotate(90deg)}}

/* ======================= idle, one per symbol (every loop starts and ends at rest) ======================= */
.ms-L1 .fx-sq{animation:fxbob 3.4s ease-in-out infinite}                         /* 10: floats on a swell */
@keyframes fxbob{0%,100%{transform:none}50%{transform:translateY(-2.5%)}}
.ms-L2 .fx-sq{transform-origin:50% 8%;animation:fxsway 3.8s ease-in-out infinite}  /* J: hangs and sways from its top */
@keyframes fxsway{0%,100%{transform:none}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.ms-L3 .fx-sq{transform-origin:50% 92%;animation:fxtilt 4.2s ease-in-out infinite} /* Q: rocks on its tail */
@keyframes fxtilt{0%,100%{transform:none}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg) translateY(-1%)}}
.ms-L4 .fx-sq{transform-origin:50% 100%;animation:fxlean 3.6s ease-in-out infinite} /* K: leans like it is about to kick */
@keyframes fxlean{0%,100%{transform:none}50%{transform:skewX(-4deg)}}
.ms-L5 .fx-sq{transform-origin:50% 100%;animation:fxbreath 3.1s ease-in-out infinite}/* A: breathes in and out */
@keyframes fxbreath{0%,100%{transform:none}50%{transform:scale(.985,1.035)}}
.ms-H1 .fx-sq{transform-origin:50% 96%;animation:fxwob 4.4s ease-in-out infinite}  /* coconut: a little wobble now and then */
@keyframes fxwob{0%,58%,100%{transform:none}64%{transform:rotate(-4deg)}72%{transform:rotate(3deg)}80%{transform:rotate(-1.5deg)}88%{transform:rotate(.6deg)}}
.ms-H2 .fx-sq{animation:fxroll 5s ease-in-out infinite}                          /* beach ball: rolls a bit and back */
@keyframes fxroll{0%,100%{transform:none}25%{transform:rotate(-7deg) translateX(-1.5%)}75%{transform:rotate(9deg) translateX(1.5%)}}
.ms-H3 .fx-sq{transform-origin:50% 95%;animation:fxsquish 3.3s ease-in-out infinite}/* mango: soft and juicy */
@keyframes fxsquish{0%,100%{transform:none}45%{transform:scale(1.02,.975)}70%{transform:scale(.99,1.015)}}
.ms-H3 .h3-leaf{transform-origin:72% 37%;animation:fxleaf 3.3s ease-in-out infinite}  /* the leaf flutters around its stem */
@keyframes fxleaf{0%,100%{rotate:0deg}30%{rotate:-4deg}55%{rotate:2deg}75%{rotate:-1.5deg}}   /* rotate, not transform: the win flap (transform) adds to it */
.ms-H3 .fx-spk{left:66%;top:29%;animation:fxtw 4.6s ease-out infinite}
.ms-H4 .fx-sq{animation:fxfloat 3.9s ease-in-out infinite}                       /* surfboard: floats */
@keyframes fxfloat{0%,100%{transform:none}25%{transform:translateY(-1.5%) rotate(-2deg)}75%{transform:translateY(-3%) rotate(2deg)}}
.ms-W .fx-sq{transform-origin:50% 80%;animation:fxride 2.8s ease-in-out infinite} /* wild: rides its wave */
@keyframes fxride{0%,100%{transform:none}25%{transform:rotate(-1.5deg) translateX(-1%)}75%{transform:rotate(1.5deg) translateX(1%) translateY(-1.5%)}}
.ms-W .fx-spk{left:61%;top:38%;width:18%;margin:-9% 0 0 -9%;animation:fxtw 3.7s ease-out infinite}   /* the sunglasses glint */
.ms-W .fx-water > i{animation-duration:6s}
.fx-glow{inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.85),rgba(255,190,60,.35) 45%,rgba(255,170,40,0) 70%);opacity:.18;animation:fxglow 2.8s ease-in-out infinite}
@keyframes fxglow{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.42;transform:scale(1.02)}}
.ms-S1 .fx-sq{animation:fxpulse 2.6s ease-in-out infinite}                       /* BONUS badge: a slow pulse */
@keyframes fxpulse{0%,100%{transform:none}50%{transform:scale(1.03)}}
.fx-rays{left:-15%;top:-15%;width:130%;height:130%;border-radius:50%;opacity:.4;transition:opacity .3s;
  background:repeating-conic-gradient(from 0deg,rgba(255,240,170,.85) 0 9deg,rgba(255,240,170,0) 9deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 70%);mask:radial-gradient(circle,#000 22%,transparent 70%);animation:fxspin 18s linear infinite}
@keyframes fxspin{to{transform:rotate(360deg)}}
.ms-S1 .fx-spk.p1{left:24%;top:30%;animation:fxtw 3.2s ease-out infinite}
.ms-S1 .fx-spk.p2{left:78%;top:24%;animation:fxtw 3.2s ease-out infinite}

/* idle starts at rest after a short wait that differs per cell (--i, the cell's index, set by skin.js), so the board breathes
   instead of pulsing, and a reel that lands shows its symbols exactly as they were in the strip (no jump on landing).
   After the idle rules, so it wins over their animation shorthand */
.fx .fx-sq,.fx .fx-sq *,.fx .fx-bk > *{animation-delay:calc(var(--i,0) * .23s)}
.ms-S1 .fx .fx-spk.p2{animation-delay:calc(var(--i,0) * .23s + 1.6s)}

/* ======================= win: one shared beat + each symbol's own part motion =======================
   Beat measured from the reference (Treasure Hunt win loop, 10 s clip, ~54 real fps): one pulse every 0.672 s
   (36 frames), every winning symbol in step. Inside a pulse: 0-22% the symbol grows to ~110% x 107%; 22-42% it flashes
   (brightness up, warmer) while it widens to ~116% x 106%; it holds the flash to ~64%; 64-86% it drops back to rest
   size and colour; 86-100% it rests. All winners share one clock: a symbol that joins starts on the clock's next beat
   (--fxws / --fxws2 from sym-fx.js MangoSymFX.sync), at rest, so it never jumps and always pulses with the others. Part motion (leaf, tilt,
   foam, drips) loops over two beats, peaks on the flashes and is back at rest on every beat boundary, so a symbol that
   leaves the spotlight at the end of a beat (skin.js leave) stops without a snap. */
:root{--fxbeat:.672s;--fxws:0s;--fxws2:0s}
.fx-pop{transform-origin:50% 58%}
/* idle pauses where it is (a few degrees at most) instead of snapping back; it carries on from there when the win ends */
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-sq{animation-play-state:paused}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-pop{animation:var(--fxpk,fxbeat) var(--fxbeat) linear infinite var(--fxws)}
@keyframes fxbeat{
  0%{transform:none;animation-timing-function:ease-out}
  22%{transform:scale(1.1,1.07);animation-timing-function:ease-in-out}
  42%{transform:scale(1.16,1.06)}
  64%{transform:scale(1.15,1.07);animation-timing-function:ease-in}
  86%{transform:scale(.99)}
  100%{transform:none}}
/* the flash per symbol: saturation is capped where a full boost changes the colour (the coconut went tomato red, the
   ball's red went neon); the coconut brightens less and loses a little saturation, so it reads as a lit brown nut */
.ms-H1{--fxpk:fxbeat-nut}.ms-H2,.ms-H3,.ms-H4{--fxpk:fxbeat-soft}
@keyframes fxbeat-nut{
  0%{transform:none;animation-timing-function:ease-out}
  22%{transform:scale(1.1,1.07);animation-timing-function:ease-in-out}
  42%{transform:scale(1.16,1.06)}
  64%{transform:scale(1.15,1.07);animation-timing-function:ease-in}
  86%{transform:scale(.99)}
  100%{transform:none}}
@keyframes fxbeat-soft{
  0%{transform:none;animation-timing-function:ease-out}
  22%{transform:scale(1.1,1.07);animation-timing-function:ease-in-out}
  42%{transform:scale(1.16,1.06)}
  64%{transform:scale(1.15,1.07);animation-timing-function:ease-in}
  86%{transform:scale(.99)}
  100%{transform:none}}
/* a warm glow behind the symbol on every flash */
.fx-flash{inset:-4%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.9),rgba(255,190,60,.45) 42%,rgba(255,170,40,0) 68%);opacity:0}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-flash{animation:fxflash var(--fxbeat) linear infinite var(--fxws)}
@keyframes fxflash{0%,22%{opacity:0;transform:scale(.9)}42%,64%{opacity:.9;transform:scale(1.08)}86%,100%{opacity:0;transform:scale(.95)}}
/* part motion: two beats per loop, at rest on 0%, 50% and 100% */
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-mv{animation:var(--wa) calc(var(--fxbeat) * 2) ease-in-out infinite var(--fxws2)}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-water > i{animation-duration:3s}
/* letters stay upright and readable: small tilts and wiggles on the beat */
.ms-L1{--wa:fxw-wig}                                  /* 10: wiggles left, right */
@keyframes fxw-wig{0%,50%,100%{transform:none}26%{transform:rotate(-7deg)}76%{transform:rotate(7deg)}}
.ms-L2{--wa:fxw-swing}.ms-L2 .fx-mv{transform-origin:50% 6%}   /* J: swings from its top */
@keyframes fxw-swing{0%,50%,100%{transform:none}26%{transform:rotate(-10deg)}76%{transform:rotate(10deg)}}
.ms-L3{--wa:fxw-tilt}.ms-L3 .fx-mv{transform-origin:50% 90%}   /* Q: rocks on its tail */
@keyframes fxw-tilt{0%,50%,100%{transform:none}26%{transform:rotate(9deg)}76%{transform:rotate(-9deg)}}
.ms-L4{--wa:fxw-kick}.ms-L4 .fx-mv{transform-origin:50% 100%}  /* K: kicks out, both ways */
@keyframes fxw-kick{0%,50%,100%{transform:none}26%{transform:skewX(-9deg) rotate(2deg)}76%{transform:skewX(8deg) rotate(-2deg)}}
.ms-L5{--wa:fxw-rock}.ms-L5 .fx-mv{transform-origin:50% 100%}  /* A: rocks on its feet */
@keyframes fxw-rock{0%,50%,100%{transform:none}26%{transform:rotate(-8deg)}76%{transform:rotate(8deg)}}
/* coconut: a juicy wobble, milk splashes out of the top on each flash */
.ms-H1{--wa:fxw-nut}.ms-H1 .fx-mv{transform-origin:50% 92%}
@keyframes fxw-nut{0%,50%,100%{transform:none}20%{transform:rotate(-9deg)}32%{transform:rotate(5deg)}43%{transform:rotate(-2deg)}70%{transform:rotate(9deg)}82%{transform:rotate(-5deg)}93%{transform:rotate(2deg)}}
.fx-milk{width:7%;aspect-ratio:1;left:50%;top:18%;margin:-3.5% 0 0 -3.5%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#eef6fa 60%,#cfe3ec);box-shadow:0 0 0 1.5px rgba(70,40,20,.45);opacity:0}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-milk{animation:fxmilk var(--fxbeat) ease-out infinite var(--fxws)}
.fx-milk.p1{--mx:-260%;--my:-220%}.fx-milk.p2{--mx:-60%;--my:-330%}.fx-milk.p3{--mx:170%;--my:-300%}.fx-milk.p4{--mx:330%;--my:-160%}
@keyframes fxmilk{0%,35%{opacity:0;transform:none}48%{opacity:1;transform:translate(calc(var(--mx) * .45),calc(var(--my) * .55)) scale(1.15)}75%{opacity:.9;transform:translate(var(--mx),var(--my)) scale(.85)}92%,100%{opacity:0;transform:translate(calc(var(--mx) * 1.15),calc(var(--my) * .6)) scale(.4)}}
/* beach ball: a full spin per beat (round, so it always reads), a hop on each flash, its shadow on the sand */
.ms-H2{--wa:fxw-spin}
@keyframes fxw-spin{0%{transform:none}26%{transform:translateY(-6%) rotate(150deg)}50%{transform:rotate(360deg)}76%{transform:translateY(-6%) rotate(510deg)}100%{transform:rotate(720deg)}}
.fx-shd{left:18%;right:18%;bottom:3%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,20,5,.35),rgba(40,20,5,0));opacity:0}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-shd{animation:fxw-shd var(--fxbeat) ease-in-out infinite var(--fxws)}
@keyframes fxw-shd{0%,100%{opacity:0;transform:scale(1)}20%,80%{opacity:.7}55%{opacity:.35;transform:scale(.75)}}
/* mango: tilts side to side, the leaf flaps on each flash, a glint on the skin */
.ms-H3{--wa:fxw-mango}.ms-H3 .fx-mv{transform-origin:50% 95%}
@keyframes fxw-mango{0%,50%,100%{transform:none}26%{transform:rotate(-8deg)}76%{transform:rotate(8deg)}}
:is(.ms.win,.grid.focusing .c.focus .ms) .h3-leaf{animation-name:fxleaf,fxw-flap;animation-duration:3.3s,var(--fxbeat);animation-timing-function:ease-in-out;animation-iteration-count:infinite;
  animation-play-state:paused,running;animation-delay:calc(var(--i,0) * .23s),var(--fxws)}   /* the idle flutter holds where it is, the flap adds to it */
@keyframes fxw-flap{0%,100%{transform:none}45%{transform:rotate(-8deg)}70%{transform:rotate(5deg)}}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-spk{animation:fxw-tw calc(var(--fxbeat) * 2) ease-out infinite var(--fxws2)}
@keyframes fxw-tw{0%,18%{opacity:0;transform:scale(0) rotate(0)}26%{opacity:1;transform:scale(1.5) rotate(60deg)}46%,100%{opacity:0;transform:scale(.2) rotate(140deg)}}
/* surfboard: tips back and forth, drips fall off its tail on each flash */
.ms-H4{--wa:fxw-board}.ms-H4 .fx-mv{transform-origin:30% 85%}
@keyframes fxw-board{0%,50%,100%{transform:none}26%{transform:rotate(-11deg)}76%{transform:rotate(9deg)}}
.fx-drp{width:6%;aspect-ratio:1;left:24%;top:86%;opacity:0}
.fx-drp::before{content:"";position:absolute;inset:0;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:linear-gradient(135deg,#f2fdff,#7fdcff 60%,#2ba4e0);box-shadow:0 0 0 1.5px rgba(10,50,80,.5)}
.fx-drp.p2{left:31%;top:90%;--dd:.08s}.fx-drp.p3{left:19%;top:80%;--dd:.16s}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-drp{animation:fxdrip var(--fxbeat) ease-in infinite calc(var(--fxws) + var(--dd,0s))}
@keyframes fxdrip{0%,40%{opacity:0;transform:translateY(0) scale(.4)}52%{opacity:1;transform:translateY(0) scale(1)}86%{opacity:1;transform:translateY(160%) scale(.9,1.1)}96%,100%{opacity:0;transform:translateY(200%) scale(.6)}}
/* wild: carves left and right on its wave, foam sprays and the sun glows on each flash */
.ms-W{--wa:fxw-surf}.ms-W .fx-mv{transform-origin:50% 80%}
@keyframes fxw-surf{0%,50%,100%{transform:none}26%{transform:translate(-4%,-3%) rotate(-7deg)}76%{transform:translate(4%,-3%) rotate(7deg)}}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-glow{animation:fxflash var(--fxbeat) linear infinite var(--fxws)}
.fx-foam{width:9%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e6f8ff 60%,#b7e6fb);box-shadow:0 0 0 1.5px rgba(10,60,100,.35);opacity:0;left:50%;top:78%}
.fx-foam.p1{--fx:-330%;--fy:-260%}.fx-foam.p2{--fx:-120%;--fy:-400%}.fx-foam.p3{--fx:140%;--fy:-380%}.fx-foam.p4{--fx:330%;--fy:-230%}.fx-foam.p5{--fx:450%;--fy:-60%}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-foam{animation:fxfoam var(--fxbeat) ease-out infinite var(--fxws)}
@keyframes fxfoam{0%,35%{opacity:0;transform:none}50%{opacity:1;transform:translate(calc(var(--fx) * .45),calc(var(--fy) * .45)) scale(1.15)}78%{opacity:.85;transform:translate(var(--fx),var(--fy)) scale(.8)}94%,100%{opacity:0;transform:translate(var(--fx),calc(var(--fy) * .6)) scale(.4)}}
/* BONUS badge: rocks, rays spin up and brighten, sparkles take turns on the flashes */
.ms-S1{--wa:fxw-badge}
@keyframes fxw-badge{0%,50%,100%{transform:none}26%{transform:rotate(-7deg)}76%{transform:rotate(7deg)}}
:is(.ms.win,.grid.focusing .c.focus .ms) .fx-rays{opacity:.95;animation-duration:5s}
.ms-S1 .fx-spk.p3{left:9%;top:50%}.ms-S1 .fx-spk.p4{left:86%;top:66%}
:is(.ms-S1.win,.grid.focusing .c.focus .ms-S1) :is(.fx-spk.p2,.fx-spk.p4){animation-delay:calc(var(--fxws2) - var(--fxbeat))}

/* no life where it would distract or cost: the spin strips (the reel is a blur, and a symbol must land exactly as it
   was drawn in the strip), dimmed symbols, .fx-still, or when the player asks for less motion */
.strip .fx,.strip .fx *,.ms.dim .fx *,.fx-still .fx,.fx-still .fx *{animation:none!important}
/* spin smoothness (Olly 2026-10-16): a reel cell is hidden while its strip spins and gets new content when it lands, so its
   idle loops stop meanwhile: fewer moving layers to update on every spin frame (pixel-identical: the cell is not shown) */
.grid .c.spinning .fx,.grid .c.spinning .fx *{animation:none!important}
/* soft motion (prefers-reduced-motion: reduce, e.g. iOS Reduce Motion): the board must never look dead, so light still
   moves but nothing travels, bobs or spins. Idle: symbols stand still; only the slow water shimmer, the shine, the
   sparkles, the wild's glow and the badge rays (very slow) stay. Win: the same shared beat, but the pop stays at or under
   106% with its brightness flash and warm glow, and the part motion is a small 3deg rock for every symbol (the beach
   ball's full spins, the J's swing and the K's kick are gone). Normal motion is untouched: everything here is inside this query */
@media (prefers-reduced-motion:reduce){
  .fx .fx-sq,.fx .h3-leaf{animation:none!important}
  .fx-water > i{animation-duration:24s}
  :is(.ms.win,.grid.focusing .c.focus .ms) .fx-water > i{animation-duration:12s}
  .fx-shine > i,.ms-H4 .fx-shine > i{animation-duration:9s}
  .fx-rays{animation-duration:90s}
  :is(.ms.win,.grid.focusing .c.focus .ms) .fx-rays{animation-duration:40s}
  .fx{--fxpk:fxbeat-calm;--wa:fxw-calm}
  .ms-H1 .fx{--fxpk:fxbeat-calm-nut}
  .ms-H2 .fx,.ms-H3 .fx,.ms-H4 .fx{--fxpk:fxbeat-calm-soft}
  .fx .fx-mv{transform-origin:50% 80%}
  @keyframes fxbeat-calm{
    0%{transform:none;animation-timing-function:ease-out}
    30%{transform:scale(1.05);animation-timing-function:ease-in-out}
    64%{transform:scale(1.06);animation-timing-function:ease-in}
    100%{transform:none}}
  @keyframes fxbeat-calm-nut{
    0%{transform:none;animation-timing-function:ease-out}
    30%{transform:scale(1.05);animation-timing-function:ease-in-out}
    64%{transform:scale(1.06);animation-timing-function:ease-in}
    100%{transform:none}}
  @keyframes fxbeat-calm-soft{
    0%{transform:none;animation-timing-function:ease-out}
    30%{transform:scale(1.05);animation-timing-function:ease-in-out}
    64%{transform:scale(1.06);animation-timing-function:ease-in}
    100%{transform:none}}
  @keyframes fxw-calm{0%,50%,100%{transform:none}26%{transform:rotate(-3deg)}76%{transform:rotate(3deg)}}
}

/* ---------- SYM3: the 3-star symbols (sym3.js builds the markup, tools/compose-sym3.py the pictures) ----------
   Only in a build with SYM3=1. A symbol is a small scene: the stone frame (never moves), the hero, props that hang off the
   frame, and for the wild and the bonus symbols a gold word. Three states, each stronger than the last:
     idle  (default)                       only the parts that would really move, small
     land  (.c.s3-land, about 1.1 s)       the hero reacts to the impact, hanging parts follow a beat later and settle
     win   (.ms.win or the win spotlight)  a loop of four beats (2.69 s) on the game's shared beat, the biggest motion
   Every state starts and ends on the rest pose. Only transform and opacity move.
   Markup (sym3.js): .ms > .s3w > .s3 > layers. A moving layer is <i class="s3l s3-ID"><b class="s3m">pictures, kids</b></i>:
   the idle motion runs on the <i>, land and win run on the <b>, so a win can start mid-idle with no jump (idle just
   pauses where it is). Face swaps are extra pictures over the rest face (.s3x-NAME) that fade in for their moment. */
.s3w{position:absolute;inset:0;container-type:size;pointer-events:none}
.s3{position:absolute;left:50%;top:50%;width:min(100cqw,100cqh);height:min(100cqw,100cqh);translate:-50% -50%}
.ms .s3 img,.mstack.s3t img{position:absolute;display:block;width:100%;height:100%;max-width:none;object-fit:fill;filter:none!important;margin:0}
.s3 .s3f{position:absolute}
.s3l{position:absolute;display:block;font-style:normal;transform-origin:var(--ox,50%) var(--oy,50%)}
.s3m{position:absolute;inset:0;display:block;transform-origin:var(--ox,50%) var(--oy,50%)}
.s3m > .s3l{z-index:1}
.s3 img[class*="s3x-"],.s3t img[class*="s3x-"]{opacity:0}
.s3-win{opacity:0}

/* the wild keeps its own lettering: the old driftwood WILD plate goes when the art has the word */
.s3w.s3-hw ~ .mx.plain{display:none}

/* face swaps are cuts (0.1% of a loop), never a cross-fade: a half-faded face shows two faces at once */
/* the one shine in the set: a light sweep across the gold WILD (polish bar section 7 line 4: one symbol type at most) */
.s3-sweep{position:absolute;inset:0;overflow:hidden;-webkit-mask:var(--wm) center/100% 100% no-repeat;mask:var(--wm) center/100% 100% no-repeat}
.s3-sweep > i{position:absolute;top:-20%;bottom:-20%;left:0;width:30%;display:block;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,240,.75) 50%,rgba(255,255,255,0));transform:translateX(-120%) skewX(-18deg);
  animation:s3sweep 4.8s ease-in-out infinite}
@keyframes s3sweep{0%,64%{transform:translateX(-120%) skewX(-18deg)}84%,100%{transform:translateX(380%) skewX(-18deg)}}

/* ======================= shared: hanging parts (shells, seaweed, flowers) =======================
   they hang from a point (their pivot) and move a beat after the hero, then settle */
.s3 .s3-shells-l,.s3 .s3-shells-r{animation:s3hang var(--hs,4.4s) ease-in-out infinite}
.s3 .s3-shells-r{animation-direction:reverse}
@keyframes s3hang{0%,100%{rotate:0deg}30%{rotate:1.8deg}70%{rotate:-1.6deg}}
.s3 .s3-seaweed-l,.s3 .s3-seaweed-r{animation:s3weed var(--ws,3.7s) ease-in-out infinite}
.s3 .s3-seaweed-r{animation-direction:reverse}
@keyframes s3weed{0%,100%{rotate:0deg}35%{rotate:3deg}70%{rotate:-2.5deg}}
/* land: hanging parts swing after the hit and damp out */
.c.s3-land .s3 :is(.s3-shells-l,.s3-shells-r,.s3-seaweed-l,.s3-seaweed-r) > .s3m{animation:s3swing 1s cubic-bezier(.3,.6,.4,1) .12s both}
.c.s3-land .s3 :is(.s3-shells-r,.s3-seaweed-r) > .s3m{animation-name:s3swingR}
@keyframes s3swing{0%,100%{transform:none}22%{transform:rotate(7deg)}46%{transform:rotate(-4deg)}68%{transform:rotate(2deg)}86%{transform:rotate(-.7deg)}}
@keyframes s3swingR{0%,100%{transform:none}22%{transform:rotate(-7deg)}46%{transform:rotate(4deg)}68%{transform:rotate(-2deg)}86%{transform:rotate(.7deg)}}
.c.s3-land .s3 .s3-hibiscus > .s3m{animation:s3nod .9s ease-out .16s both}
@keyframes s3nod{0%,100%{transform:none}30%{transform:rotate(-9deg) scale(1.06)}60%{transform:rotate(4deg)}82%{transform:rotate(-1.5deg)}}

/* ======================= idle, one per symbol type (no two alike) ======================= */
/* H1 coconut: the cocktail umbrella turns slowly on its stick; the nut itself is still */
.s3k-H1 .s3-umb{animation:s3twirl 5.2s ease-in-out infinite}
@keyframes s3twirl{0%,100%{rotate:0deg;scale:1 1}28%{rotate:-6deg;scale:.9 1}50%{rotate:-2deg;scale:.97 1}74%{rotate:4deg;scale:1 1}}

@keyframes s3roll{0%,100%{translate:0 0;rotate:0deg}20%{translate:0 -3%;rotate:5deg}40%{translate:0 0;rotate:8deg}60%{translate:0 -2%;rotate:4deg}80%{translate:0 0;rotate:-2deg}}
/* H3 mango: the leaf flutters on its stem */
.s3k-H3 .s3-leaf{animation:s3leaf 3.3s ease-in-out infinite}
@keyframes s3leaf{0%,100%{rotate:0deg}30%{rotate:-5deg}55%{rotate:2.5deg}75%{rotate:-1.5deg}}
/* H4 surfboard: rocks on a wave line */
.s3k-H4 .s3-hero{animation:s3rock 4s ease-in-out infinite}
@keyframes s3rock{0%,100%{rotate:0deg;translate:0 0}25%{rotate:-2.5deg;translate:0 -1.5%}75%{rotate:2.5deg;translate:0 -.5%}}
/* W: the wave rolls, the surfer sways with it a beat later and blinks, now and then a happy squint */
.s3k-W .s3-wave{animation:s3wave 3.6s ease-in-out infinite}
@keyframes s3wave{0%,100%{rotate:0deg;scale:1 1}40%{rotate:-1.5deg;scale:1.02 .99}75%{rotate:1deg;scale:.99 1.01}}
.s3k-W .s3-hero{animation:s3surf 3.6s ease-in-out .25s infinite}

.s3 .s3-hero .s3x-blink{animation:s3blink 4.8s linear infinite}
/* the sun and the whale blink too, each on its own clock (no blink file: no blink, the rest face stays) */
.s3 .s3-sun .s3x-blink{animation:s3blink2 5.6s linear infinite}
.s3k-S2 .s3-hero .s3x-blink{animation:s3blink3 4.2s linear infinite}
@keyframes s3blink2{0%,62%{opacity:0}62.1%,65%{opacity:1}65.1%,100%{opacity:0}}

/* the sun / whale blink with the squint face when they have no blink face (still a face change, never a squash) */
/* S1 bonus: the palms sway against each other; the sun is still in idle (its faces are for land and win) */
.s3k-S1 .s3-palm-l{animation:s3palm 4.2s ease-in-out infinite}

@keyframes s3wheel{0%,100%{rotate:0deg}50%{rotate:6deg}}

@keyframes s3puff{0%,55%,100%{scale:1 .7;opacity:.85}68%{scale:1 1.08;opacity:1}82%{scale:1 .95}}
.s3k-S2 .s3-hero{animation:s3breath 3.4s ease-in-out infinite}
@keyframes s3breath{0%,55%,100%{scale:1 1}66%{scale:1.02 .98}}

/* idle waits a little per cell (--i, set by skin.js) so the board breathes instead of pulsing; it starts at rest, so a
   landed reel shows its symbols exactly as the spinning strip drew them */
.s3 .s3l{animation-delay:calc(var(--i,0) * .23s)}
.s3k-S1 .s3-palm-r{animation-delay:calc(var(--i,0) * .23s - 2.1s)}

/* ======================= land (about 1.1 s): a reaction, then back to rest ======================= */

@keyframes s3land{0%,100%{transform:none}16%{transform:translateY(3%) scale(1.04,.95)}38%{transform:translateY(-3%) scale(.98,1.03)}62%{transform:translateY(1%)}82%{transform:translateY(-.4%)}}

@keyframes s3sink{0%,100%{transform:none}18%{transform:translateY(6%) scale(1.03,.96)}40%{transform:translateY(-3%)}60%{transform:translateY(2%)}80%{transform:translateY(-.6%)}}
.c.s3-land .s3k-H1 .s3-umb > .s3m{animation:s3tip 1s ease-out .1s both}

.c.s3-land .s3k-H2 .s3-splash > .s3m,.c.s3-land .s3k-H1 .s3-splash > .s3m{animation:s3splash-land .8s ease-out both}

@keyframes s3squish{0%,100%{transform:none}16%{transform:scale(1.12,.88)}36%{transform:scale(.94,1.07)}56%{transform:scale(1.03,.97)}78%{transform:scale(.99,1.01)}}

@keyframes s3thunk{0%,100%{transform:none}20%{transform:translateY(-7%) rotate(-4deg)}34%{transform:translateY(2%) rotate(1deg) scale(1.02,.97)}52%{transform:translateY(-1.5%)}74%{transform:translateY(.4%)}}

@keyframes s3surge{0%,100%{transform:none}30%{transform:scale(1.05) rotate(-2deg)}60%{transform:scale(.99) rotate(1deg)}}

/* S2: the whale is surprised, the crown hops off its head and lands late, the spout gushes */

@keyframes s3whale{0%,100%{transform:none}20%{transform:translateY(-5%) scale(1.06)}50%{transform:translateY(2%) scale(.98,1.02)}76%{transform:translateY(-1%)}}

/* ======================= where nothing moves ======================= */
/* spinning strips, the peeks above and below the window, dimmed symbols, reduced motion: still. While the reels spin the
   board holds (#grid.sm-calm), except a reel that has just landed, which plays its land */

.grid.sm-calm .c:not(.s3-land) .s3 *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.s3 .s3l{animation:none!important}.s3-sweep > i{animation:none!important}}

/* ======================= low symbols (10 J Q K A): no idle at all, each keeps its own win ======================= */
.sym3 :is(.ms-L1,.ms-L2,.ms-L3,.ms-L4,.ms-L5) .fx-sq{animation:none!important}
.sym3 :is(.ms-L1,.ms-L2,.ms-L3,.ms-L4,.ms-L5) :is(.fx-shine,.fx-water){display:none!important}
/* no glow doing the work: the warm flash and the baked glow behind a winning letter are off; its own move carries the win */
.sym3 :is(.ms-L1,.ms-L2,.ms-L3,.ms-L4,.ms-L5) .fx-flash,.sym3 :is(.ms-L1,.ms-L2,.ms-L3,.ms-L4,.ms-L5) .fx-bk::after{display:none!important}

   degrees). Not while the cell is already in a win */
.sym3 .c.s3-land:not(.hit):not(.focus) :is(.ms-L1,.ms-L2,.ms-L3,.ms-L4,.ms-L5) .fx-mv{animation:var(--l3) .7s ease-out both}

// Mango Surf symbol life (anim-v2): the inside of a symbol (.ms) with its animation layers. Styles: sym-fx.css. Layers and the prototype: anim-v2/symbols/.
// MangoSymFX.inner(k, src) returns the HTML that goes inside <div class="ms ms-K" style="--src:url(..)">, in place of the
// plain <img>. src is the game's cache-busting src(name) (every picture goes through it). Particle classes are p1..p5
// (never single letters: .c is the game's cell class).
// MangoSymFX.win(ms, on) turns the win loop on or off for one symbol (the game's win walk uses its spotlight, .c.focus, and
// MangoSymFX.sync(cell) instead), on the shared beat: every winner pulses together, even one that starts later, because
// it starts on the next beat of one clock (performance.now()).
(function(){
  const BEAT = 672;   // ms, measured from the reference win loop (keep in step with --fxbeat in sym-fx.css)
  const n = (cls, k) => Array.from({length: k}, (_, i) => `<i class="${cls} p${i + 1}"></i>`).join('');
  const img = (src, k, cls) => `<img class="${cls}" src="${src(k)}" alt="" draggable="false" decoding="sync">`;
  const WATER = {L1: 1, L2: 1, L3: 1, L4: 1, L5: 1, W: 1}, SHINE = {L1: 1, L2: 1, L3: 1, L4: 1, L5: 1, H2: 1, H4: 1, S1: 1};
  // (smooth pass 2) the layers only a win shows (the flash, the ball's shadow, milk, foam, drips, the badge's 3rd and 4th
  // sparkle) sit at zero opacity until then: a cell is drawn without them and dress() adds them, in the same places and
  // order, the moment the symbol joins a win (sync / win). Fewer elements to build and style at every landing
  const WIN_BACK = {H2: '<i class="fx-shd"></i>'};
  const WIN_FRONT = {W: () => n('fx-foam', 5), S1: () => '<i class="fx-spk p3"></i><i class="fx-spk p4"></i>', H1: () => n('fx-milk', 4), H4: () => n('fx-drp', 3)};
  function inner(k, src){

    body = k === 'H3' ? img(src, 'H3-body', 'h3-body') + img(src, 'H3-leaf', 'h3-leaf') : img(src, k, 'base');
    if (WATER[k]) body += '<i class="fx-water"><i></i></i>';
    if (SHINE[k]) body += '<i class="fx-shine"><i></i></i>';
    if (k === 'W'){ back += '<i class="fx-glow"></i>'; front = '<i class="fx-spk"></i>'; }
    if (k === 'S1'){ back += '<i class="fx-rays"></i>'; front = '<i class="fx-spk p1"></i><i class="fx-spk p2"></i>'; }

  // the shared beat: every winner pulses on one clock. A symbol that joins waits for the next beat boundary (the beat
  // starts and ends at rest, so it never jumps): --fxws is that wait, --fxws2 the wait for the two-beat part motion (the
  // next even beat, so its loops line up with everyone else's)
  const sync = el => { if (!el) return; dress(el); const now = performance.now(), t1 = Math.ceil(now / BEAT) * BEAT, d = t1 - now;

  // the loading screen up it switches on (its pictures are in by then) as the loader fades, never a beat after it has gone

// Mango Surf v3, SYM3: the 3-star symbols (styles: sym3.css; pictures and layout: tools/compose-sym3.py -> img/sym3/sym3.json,
// put in the page by build.js as window.MANGO_SYM3). Only in a build with SYM3=1. Runs after skin.js and sym-fx.js, before
// the game script, and changes only how symbols are drawn:
//   - MangoSymFX.inner(k) draws the layered scene for H1-H4, W and S1 (frame, hero, props, word) when its art is in;
//     any other symbol, or one whose new art has not arrived, keeps the current picture and motion
//   - MangoArt.symbol('legend') draws S2 (Kahuna) as its own symbol once its art is in (it used to reuse S1's picture)
//   - MangoSkin.stack draws the full-reel wild as a tall stone frame with the wave inside

    var pics = img(n.f), f = n.faces || {};
    Object.keys(f).forEach(function(name){ pics += img(f[name], 's3x-' + name); });
    if (n.word && k === 'W') pics += '<i class="s3-sweep" style="--wm:url(' + n.f + ')"><i></i></i>';   // the one shine in the set
    var kids = (n.kids || []).map(function(c){ return node(c, k); }).join('');
    return '<i class="s3l s3-' + n.id + (n.win ? ' s3-win' : '') + '" style="' + box(n.r) + ';--ox:' + n.o[0] + '%;--oy:' + n.o[1] + '%"><b class="s3m">' + pics + kids + '</b></i>';

  function html(k){
    if (cache[k]) return cache[k];
    var s = M.keys[k], word = s.layers.some(function(n){ return n.word; });

      + s.layers.map(function(n){ return node(n, k); }).join('') + '</span></span>');

  }

  // the old effects that move the whole symbol box (the hit pop, the anticipation heartbeat) or lay a shine or glow over it

  var on = Object.keys(M.keys).filter(use), css = '';

      + '.grid .c ' + s + '::after{display:none!important}.grid.focusing .c.focus ' + s + '{filter:none!important}'; });

  function tower(Mx, sticky){
    var tier = Mx >= 200 ? 't4' : Mx >= 50 ? 't3' : Mx >= 10 ? 't2' : Mx > 1 ? 't1' : 't0', f = T.faces || {}, faces = '';
    Object.keys(f).forEach(function(n){ faces += img(f[n], 's3x-' + n); });

    return '<div class="mstack s3t ' + tier + '" style="--fr:url(' + T.frame + ');--sl:' + T.slice.map(function(v){ return v + '%'; }).join(' ') + '">'
      + '<i class="s3t-frame"></i>'
      + (T.wave ? '<i class="s3t-sea">' + img(T.wave, 's3t-wave') + '</i>' : '')
      + (T.rider ? '<i class="s3t-ride" style="--rar:' + T.riderAR + '"><b class="s3t-rm">' + img(T.rider) + faces + '</b></i>' : '')
      + word
      + (Mx > 1 ? '<b class="mx big">x' + fmtM(Mx) + '</b>' : T.word ? '' : '<b class="mx big plain">WILD</b>')
      + (sticky ? '<i class="lk" aria-hidden="true"></i>' : '') + '</div>';

  function urls(){ var u = []; on.forEach(function(k){ (function walk(ns){ ns.forEach(function(n){ u.push(n.f); var f = n.faces || {}; Object.keys(f).forEach(function(x){ u.push(f[x]); }); walk(n.kids || []); }); })(M.keys[k].layers); });

  var KEYS = ['H1', 'H2', 'H3', 'H4', 'W', 'S1', 'S2', 'L1', 'L2', 'L3', 'L4', 'L5'];
  var src = function(k){ return 'img/' + k + '.webp'; };
  function sym(k){ var w = k === 'W' ? '<b class="mx plain">WILD</b>' : '';
    if (k === 'S2' && !M.keys.S2) k = 'S1';
    return '<div class="ms ms-' + k + '">' + MangoSymFX.inner(k, src) + w + '</div>'; }
  function paint(c){ c.innerHTML = sym(c.dataset.k); }
  function set(c, st){
    paint(c); c.classList.remove('s3-land');
    var ms = c.firstElementChild;
    if (st === 'land') requestAnimationFrame(function(){ MangoSym3.land(c); });
    if (st === 'win') MangoSymFX.win(ms, true);
  }
  function setTower(r, st){ r.classList.toggle('h-hit', st === 'win'); }
  if (q.get('board')){
    root.className = 'board';
    var mix = ['H1','L1','W','L3','H2','L2','H3','L4','S1','H4','H1','L5','H2','W','L1','H3','S1','L2','H4','L4'];
    root.innerHTML = mix.map(function(k, i){ return '<div class="c" data-k="' + k + '" style="--i:' + ((i * 3) % 10) + '"></div>'; }).join('');
    root.querySelectorAll('.c').forEach(paint);
    var n = 0, t0 = performance.now(), el = document.getElementById('fps'), worst = 0, last = t0;
    (function f(now){ n++; worst = Math.max(worst, now - last); last = now;
      if (now - t0 > 1000){ el.textContent = 'fps ' + Math.round(n * 1000 / (now - t0)) + ' | worst frame ' + worst.toFixed(1) + ' ms'; window.__fps = {fps: n * 1000 / (now - t0), worst: worst}; n = 0; t0 = now; worst = 0; }
      requestAnimationFrame(f); })(t0);
    return;
  }
  if (q.get('show')){
    // the showcase (polish bar line 20): one symbol at a time on a plain themed background, Idle, then Land, then Win,
    // each with a caption. qa-sym3/showcase.js records it at 1280x720
    document.body.className = 'show'; document.querySelector('h1').remove(); document.querySelector('.note').remove(); document.querySelector('.bar').remove();
    root.className = 'stage'; root.innerHTML = '<div class="cap"><b id="capk"></b><span id="caps"></span></div><div id="slot"></div>';
    var LIST = [['W', 'WILD'], ['S1', 'SURF BONUS'], ['S2', 'KAHUNA'], ['tower', 'WILD REEL'], ['H3', 'MANGO']], STEPS = [['idle', 'Idle', 1200], ['land', 'Land', 1150], ['win', 'Win', 2690]];
    var slot = document.getElementById('slot'), wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
    (async function(){
      await Promise.all(MangoSym3.urls().map(function(u){ var im = new Image(); im.src = u; return im.decode ? im.decode().catch(function(){}) : null; }));
      await wait(300); window.__showStart = performance.now();
      for (var i = 0; i < LIST.length; i++){ var k = LIST[i][0]; document.getElementById('capk').textContent = LIST[i][1];
        if (k === 'tower') slot.innerHTML = '<div class="reel big-reel"><div class="stackov">' + MangoSym3.tower(0) + '</div></div>';
        else slot.innerHTML = '<div class="cell big-cell"><div class="c" data-k="' + k + '" style="--i:0"></div></div>';
        for (var j = 0; j < STEPS.length; j++){ var st = STEPS[j][0]; document.getElementById('caps').textContent = STEPS[j][1];
          if (k === 'tower'){ var r = slot.querySelector('.reel'); r.classList.toggle('h-hit', st === 'win');
            if (st !== 'win') r.firstElementChild.innerHTML = MangoSym3.tower(0).replace('mstack s3t', 'mstack s3t' + (st === 'land' ? ' s3t-in' : '')); }
          else set(slot.querySelector('.c'), st);
          await wait(STEPS[j][2]); } }
      window.__showDone = performance.now(); })();
    return;
  }
  var keys = q.get('key') ? [q.get('key')] : KEYS;
  if (q.get('key')) document.body.classList.add('big');
  var html = keys.map(function(k){
    var s = M.keys[k], tag = s ? (s.real ? '<span class="tag">new art</span>' : '<span class="tag fb">current art</span>') : (/^L/.test(k) ? '<span class="tag fb">current art</span>' : '<span class="tag fb">no art yet: shows S1</span>');
    return '<div class="card"><h2>' + k + ' <small>' + NAME[k] + '</small> ' + tag + '</h2><div class="cell"><div class="c" data-k="' + k + '" style="--i:0"></div></div>'
      + '<div class="btns"><button data-st="idle">Idle</button><button data-st="land">Land</button><button data-st="win">Win</button></div></div>';
  });
  if (M.tower && !q.get('key')) html.push('<div class="card"><h2>Wild reel <small>full-reel tower</small> ' + (M.tower.real ? '<span class="tag">new art</span>' : '<span class="tag fb">current art</span>') + '</h2>'
    + '<div class="reel" id="tower"><div class="stackov">' + MangoSym3.tower(0) + '</div></div>'
    + '<div class="btns"><button data-tw="idle">Idle</button><button data-tw="win">Win</button><button data-tw="x5">x5 tag</button></div></div>');
  root.innerHTML = html.join('');
  root.querySelectorAll('.c').forEach(paint);
  root.addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; var card = b.closest('.card');
    if (b.dataset.st) set(card.querySelector('.c'), b.dataset.st);
    if (b.dataset.tw){ var r = card.querySelector('.reel'); if (b.dataset.tw === 'x5'){ r.firstElementChild.innerHTML = MangoSym3.tower(5); return; } setTower(r, b.dataset.tw); } });
  function all(st){ root.querySelectorAll('.c').forEach(function(c){ set(c, st); }); var r = document.getElementById('tower'); if (r) setTower(r, st === 'win' ? 'win' : 'idle'); }
  document.querySelector('.bar').addEventListener('click', function(e){ var b = e.target.closest('button[data-all]'); if (b) all(b.dataset.all); });
  if (q.get('state')) all(q.get('state'));
  window.__labAll = all;
})();
</script>
</body>
